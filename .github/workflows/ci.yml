name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==9.1.1
      - name: Run tests
        run: PYTHONPATH=src python -m pytest -o addopts='' --disable-warnings
      - name: Compile sources
        run: python -m compileall -q src tests scripts
      - name: Verify artifacts
        run: make verify
